name: "Nuevo Item Jerárquico"
description: "Crea un item con su nivel y relación padre-hijo"
title: "[Nivel] - Título"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Selecciona el nivel y el padre (si aplica)
        > **Importante:** Solo los items que NO son Epica necesitan un padre.
        > **Jerarquía:** Epica > Feature > Historia De Usuario > Tarea (Bug está al mismo nivel que Tarea).
        >
        > Selecciona **SOLO** el campo de padre que corresponde a tu nivel:
        > - **Feature** → usa **Padre (Epica)**
        > - **Historia De Usuario** → usa **Padre (Feature)**
        > - **Tarea** → usa **Padre (Historia de Usuario)**
        > - **Bug** → usa **Padre (Historia de Usuario)**
        >
        > La lista de opciones se genera automáticamente con los issues existentes
        > de cada nivel. Si no aparece el padre que necesitas, créalo primero.
        >
        > El título del issue es obligatorio y debe reemplazar el placeholder.

  - type: dropdown
    id: nivel
    attributes:
      label: "Nivel"
      description: "Elige el tipo de item"
      options:
        - Epica
        - Feature
        - Historia De Usuario
        - Tarea
        - Bug
    validations:
      required: true

  - type: dropdown
    id: padre_epica
    attributes:
      label: "Padre (Epica)"
      description: "Para nivel Feature. Elige la Epica superior."
      options:
        - '#13 - Epica 1'
    validations:
      required: false

  - type: dropdown
    id: padre_feature
    attributes:
      label: "Padre (Feature)"
      description: "Para nivel Historia De Usuario. Elige el Feature superior."
      options:
        - '#14 - ID0001'
        - '#12 - ID0001'
        - '#11 - TASK 5'
    validations:
      required: false

  - type: dropdown
    id: padre_historia
    attributes:
      label: "Padre (Historia de Usuario)"
      description: "Para nivel Tarea o Bug. Elige la Historia de Usuario superior."
      options:
        - '#15 - HUS 02'
    validations:
      required: false

  - type: dropdown
    id: status
    attributes:
      label: "Status"
      description: "Selecciona el estado del item"
      options:
        - Nuevo
        - En Progreso
        - En Revisión
        - Completado
    validations:
      required: false

  - type: input
    id: fecha_previsto_inicio
    attributes:
      label: "Fecha Previsto Inicio"
      description: "Fecha estimada de inicio (formato: AAAA-MM-DD)"
      placeholder: "AAAA-MM-DD"
    validations:
      required: false

  - type: input
    id: fecha_previsto_fin
    attributes:
      label: "Fecha Previsto Fin"
      description: "Fecha estimada de término (formato: AAAA-MM-DD)"
      placeholder: "AAAA-MM-DD"
    validations:
      required: false

  - type: input
    id: fecha_real_inicio
    attributes:
      label: "Fecha Real Inicio"
      description: "Fecha real de inicio (formato: AAAA-MM-DD)"
      placeholder: "AAAA-MM-DD"
    validations:
      required: false

  - type: input
    id: fecha_real_final
    attributes:
      label: "Fecha Real Final"
      description: "Fecha real de término (formato: AAAA-MM-DD)"
      placeholder: "AAAA-MM-DD"
    validations:
      required: false

  - type: textarea
    id: descripcion
    attributes:
      label: "Descripción"
      description: "Detalla el contenido de este item"
    validations:
      required: false
