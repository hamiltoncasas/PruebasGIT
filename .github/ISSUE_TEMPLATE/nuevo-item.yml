name: "Nuevo Item Jerárquico"
description: "Crea un item con su nivel y relación padre-hijo"
title: "[Nivel] - Título"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Selecciona el nivel y el padre (si aplica)
        > **Importante:** Solo los items que NO son Epica necesitan un padre.
        > **Jerarquía:** Epica > Feature > Historia De Usuario > Tarea (Bug está al mismo nivel que Tarea).
        >
        > **¿Cómo elegir el padre?** En el campo **"Padre"** cada opción
        > muestra el nivel entre paréntesis: `(Epica) #1 - Título`,
        > `(Feature) #2 - Título`, `(Historia De Usuario) #3 - Título`.
        > Elige **solo** la opción cuyo nivel sea el **inmediatamente superior** al tuyo:
        > - **Feature** → elige una opción `(Epica)`
        > - **Historia De Usuario** → elige una opción `(Feature)`
        > - **Tarea o Bug** → elige una opción `(Historia De Usuario)`
        > - **Epica** → deja el padre vacío
        >
        > ⚠️ El formulario de GitHub no permite listas dinámicas: debes
        > **crear primero el nivel superior** para que aparezca en la lista.
        > La lista se actualiza automáticamente con cada issue creado.
        >
        > 💡 **Alternativa recomendada:** Si tu repositorio tiene habilitada la
        > función "Sub-issues" (Settings → General → Issues), al crear el issue
        > verás en el panel derecho el campo **Parent issue**, que es un buscador
        > dinámico. Puedes usarlo en lugar del combobox de abajo si prefieres.
        >
        > El título del issue es obligatorio y debe reemplazar el placeholder.

  - type: dropdown
    id: nivel
    attributes:
      label: "Nivel"
      description: "Elige el tipo de item"
      options:
        - Epica
        - Feature
        - Historia De Usuario
        - Tarea
        - Bug
    validations:
      required: true

  - type: dropdown
    id: padre
    attributes:
      label: "Padre"
      description: "Selecciona el issue superior (su nivel aparece entre paréntesis). Aparece en la lista al crear primero el superior."
      options:
