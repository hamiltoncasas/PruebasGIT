name: "Nuevo Item Jerárquico"
description: "Crea un item con su nivel y relación padre-hijo"
title: "[Nivel] - Título"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Jerarquía: Epica > Feature > Historia De Usuario > Tarea
        Usa el campo Padre que corresponda: Feature→(Epica), Historia→(Feature), Tarea/Bug→(Historia).

  - type: dropdown
    id: nivel
    attributes:
      label: "Nivel"
      description: "Elige el tipo de item"
      options:
        - Epica
        - Feature
        - Historia De Usuario
        - Tarea
        - Bug
    validations:
      required: true

  - type: dropdown
    id: padre_epica
    attributes:
      label: "Padre (Epica)"
      description: "Solo si Nivel = Feature"
      options:
        - '#13 - Epica 1'
    validations:
      required: false

  - type: dropdown
    id: padre_feature
    attributes:
      label: "Padre (Feature)"
      description: "Solo si Nivel = Historia De Usuario"
      options:
        - '#14 - ID0001'
        - '#12 - ID0001'
        - '#11 - TASK 5'
    validations:
      required: false

  - type: dropdown
    id: padre_historia
    attributes:
      label: "Padre (Historia de Usuario)"
      description: "Solo si Nivel = Tarea o Bug"
      options:
        - '#15 - HUS 02'
    validations:
      required: false

  - type: dropdown
    id: status
    attributes:
      label: "Status"
      description: "Selecciona el estado del item"
      options:
        - Nuevo
        - En Progreso
        - En Revisión
        - Completado
    validations:
      required: false

  - type: date
    id: fecha_previsto_inicio
    attributes:
      label: "Fecha Previsto Inicio"
      description: "Fecha estimada de inicio"
    validations:
      required: false

  - type: date
    id: fecha_previsto_fin
    attributes:
      label: "Fecha Previsto Fin"
      description: "Fecha estimada de término"
    validations:
      required: false

  - type: date
    id: fecha_real_inicio
    attributes:
      label: "Fecha Real Inicio"
      description: "Fecha real de inicio"
    validations:
      required: false

  - type: date
    id: fecha_real_final
    attributes:
      label: "Fecha Real Final"
      description: "Fecha real de término"
    validations:
      required: false

  - type: textarea
    id: descripcion
    attributes:
      label: "Descripción"
      description: "Detalla el contenido de este item"
    validations:
      required: false
