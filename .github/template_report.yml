# .github/template_report.yml
name: "Nuevo Item Jerárquico"
description: "Crea un item con su nivel y relación"
title: "[Nivel] - Título"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Selecciona el nivel y el padre (si aplica)

  - type: dropdown
    id: nivel
    attributes:
      label: "Nivel"
      description: "Elige el tipo de item"
      options:
        - Epica
        - Feature
        - Historia De Usuario
        - Tarea
        - Bug
    validations:
      required: true

  - type: dropdown
    id: padre
    attributes:
      label: "Issue superior"
      description: "Selecciona el Issue padre al que pertenece este item."
      options:
        - Ninguno (es Epica)
        # 👇 Aquí se insertarán dinámicamente los Issues
        # {parents}
    validations:
      required: false

  - type: textarea
    id: descripcion
    attributes:
      label: "Descripción"
      description: "Detalla el contenido de este item"
    validations:
      required: true