name: Procesar Jerarquía de Issue

on:
  issues:
    types: [opened]

jobs:
  procesar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Extraer datos del formulario
        id: datos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // El body del issue, tal cual lo genera el formulario
            const body = context.payload.issue.body || '';

            // Normaliza: minúsculas, sin acentos/diacríticos, espacios simples, sin puntuación
            const normalize = (str) => (str || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/[()\[\]"'"?.,:]/g, '')
              .replace(/\s+/g, ' ')
              .trim()
              .toLowerCase();

            // Mapeo de headings normalizados -> etiquetas de salida.
            // Todas las variantes del campo padre apuntan a un único "Padre".
            const expected = {
              'nivel': 'Nivel',
              'padre': 'PADRE',
              'padre epica': 'PADRE',
              'padre feature': 'PADRE',
              'padre historia de usuario': 'PADRE',
              'numero del issue superior': 'PADRE',
              'numero del issue superior padre': 'PADRE',
              'status': 'Status',
              'fecha previsto inicio': 'Fecha Previsto Inicio',
              'fecha previsto fin': 'Fecha Previsto Fin',
              'fecha real inicio': 'Fecha Real Inicio',
              'fecha real final': 'Fecha Real Final',
              'descripcion': 'Descripción'
            };

            const lines = body.replace(/\r/g, '').split('\n');
            const values = {};
            for (const label of Object.values(expected)) {
              values[label] = '';
            }

            for (let i = 0; i < lines.length; i++) {
              const m = lines[i].trim().match(/^(#{1,6})\s*(.+)$/);
              if (!m) continue;
              const heading = normalize(m[2]);
              if (Object.prototype.hasOwnProperty.call(expected, heading)) {
                const target = expected[heading];
                // El valor está en las líneas siguientes: saltar vacías,
                // detenerse al encontrar otro heading (campo vacío).
                for (let j = i + 1; j < lines.length; j++) {
                  const ln = lines[j].trim();
                  if (ln.startsWith('#')) break;
                  if (ln && ln.toLowerCase().replace(/_/g, ' ') !== 'no response' && !values[target]) {
                    values[target] = ln;
                    break;
                  }
                }
              }
            }

            if (!values['Nivel']) {
              const err = `No se encontró el valor de '### Nivel' en el cuerpo del issue.\n\n` +
                `Contenido recibido (primeras 800 caracteres):\n\`\`\`\n${body.slice(0, 800)}\n\`\`\``;
              // Dejar evidencia visible en el propio issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Error de procesamiento:** ${err}`
              });
              core.setFailed(err);
              return;
            }

            // Escribir las variables a GITHUB_ENV para los pasos siguientes
            const envLines = [
              `NIVEL=${values['Nivel']}`,
              `PADRE=${values['PADRE']}`,
              `STATUS=${values['Status']}`,
              `FECHA_PREVISTO_INICIO=${values['Fecha Previsto Inicio']}`,
              `FECHA_PREVISTO_FIN=${values['Fecha Previsto Fin']}`,
              `FECHA_REAL_INICIO=${values['Fecha Real Inicio']}`,
              `FECHA_REAL_FINAL=${values['Fecha Real Final']}`,
              `DESCRIPCION=${values['Descripción']}`
            ];
            fs.appendFileSync(process.env.GITHUB_ENV, envLines.join('\n') + '\n');

            console.log('Datos extraídos:', JSON.stringify(values, null, 2));

      - name: Asignar etiqueta según nivel
        run: |
          NIVEL_NORMALIZADO=$(echo "${{ env.NIVEL }}" | tr '[:upper:]' '[:lower:]' | sed 's/á/a/g; s/é/e/g; s/í/i/g; s/ó/o/g; s/ú/u/g; s/ü/u/g; s/ñ/n/g; s/ /_/g; s/[^a-z0-9_]//g')
          case "$NIVEL_NORMALIZADO" in
            "epica") LABEL="epic" ;;
            "feature") LABEL="feature" ;;
            "historia_de_usuario") LABEL="user-story" ;;
            "tarea") LABEL="task" ;;
            "bug") LABEL="bug" ;;
            *)
              echo "ERROR: Nivel no reconocido: '${{ env.NIVEL }}'"
              exit 1
              ;;
          esac

          if [ -z "$LABEL" ]; then
            echo "ERROR: No se pudo asignar etiqueta para Nivel='${{ env.NIVEL }}'"
            exit 1
          fi

          echo "LABEL=$LABEL" >> $GITHUB_ENV
          echo "NIVEL_NORMALIZADO=$NIVEL_NORMALIZADO" >> $GITHUB_ENV

      - name: Agregar etiqueta al Issue
        uses: actions/github-script@v7
        env:
          LABEL: ${{ env.LABEL }}
        with:
          script: |
            const issue = context.issue;
            await github.rest.issues.addLabels({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              labels: [process.env.LABEL]
            });

      - name: Obtener padre y issues superiores (cadena de ancestros)
        id: jerarquia
        uses: actions/github-script@v7
        env:
          PADRE: ${{ env.PADRE }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo, number } = context.issue;

            const normalize = text => (text || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .trim()
              .toLowerCase();

            const extractField = (body, fieldName) => {
              const lines = (body || '').replace(/\r/g, '').split('\n');
              const pattern = new RegExp('^###\\s*' + fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*$', 'i');
              for (let i = 0; i < lines.length; i++) {
                if (pattern.test(lines[i])) {
                  for (let j = i + 1; j < lines.length; j++) {
                    const line = lines[j].trim();
                    if (line && !line.startsWith('#') && normalize(line).replace(/_/g, ' ') !== 'no response') {
                      return line;
                    }
                  }
                  break;
                }
              }
              return '';
            };

            // El valor del dropdown tiene la forma "(Epica) #42 - Título".
            // Extraemos el número (y el nivel) del issue padre.
            const padreRaw = (process.env.PADRE || '').trim();
            let padre = '';
            let nivelPadreSeleccionado = '';
            if (padreRaw) {
              const m = padreRaw.match(/#(\d+)/);
              padre = m ? m[1] : '';
              const nv = padreRaw.match(/^\(([^)]+)\)/);
              if (nv) nivelPadreSeleccionado = normalize(nv[1]);
            }

            // Fallback: si no se pudo extraer del env, buscar en el body del issue
            // actual con todas las variantes de campo padre.
            if (!padre) {
              const body = context.payload.issue.body || '';
              const variantes = [
                'Padre (Epica)',
                'Padre (Feature)',
                'Padre (Historia de Usuario)',
                'Número del Issue superior (padre)',
                'Número del Issue superior',
                'Padre'
              ];
              for (const v of variantes) {
                const val = extractField(body, v);
                if (val) {
                  const m = val.match(/#(\d+)/);
                  if (m) { padre = m[1]; break; }
                  const n = val.match(/\d+/);
                  if (n) { padre = n[0]; break; }
                }
              }
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `PADRE=${padre}\n`);
            console.log('Nivel:', process.env.NIVEL, '-> Padre seleccionado:', padre || 'ninguno');

            // Reconstruir la cadena de issues superiores (ancestros) hacia arriba.
            // Cada issue generado por este workflow lleva una etiqueta "parent-N".
            // Los issues antiguos pueden indicar su padre en el body del formulario.
            // Subimos por esa cadena hasta llegar a la raíz.
            const ancestors = [];
            const seen = new Set();
            let current = padre;
            for (let i = 0; i < 10 && current; i++) {
              const num = Number(current);
              if (!Number.isInteger(num) || seen.has(num)) break;
              seen.add(num);

              const issueData = await github.rest.issues.get({
                owner, repo, issue_number: num
              });
              const data = issueData.data;

              // 1) Buscar la etiqueta parent-XXX en el issue (su propio padre)
              let parentNum = '';
              const parentLabel = (data.labels || []).find(l => /^parent-\d+$/.test(l.name));
              if (parentLabel) {
                parentNum = parentLabel.name.split('-')[1];
              } else {
                // 2) Issues antiguos: el padre está en el body del formulario
                const body = data.body || '';
                const extractMulti = (fields) => {
                  for (const f of fields) {
                    const v = extractField(body, f);
                    if (v) return v;
                  }
                  return '';
                };
                // Formulario actual (dropdown "Padre")
                let padreBody = extractField(body, 'Padre');
                // Formulario anterior con varios selectores
                if (!padreBody) {
                  padreBody = extractMulti([
                    'Padre (Epica)',
                    'Padre (Feature)',
                    'Padre (Historia de Usuario)'
                  ]);
                }
                // Formulario más antiguo (campo manual)
                if (!padreBody) {
                  padreBody = extractMulti([
                    'Número del Issue superior (padre)',
                    'Número del Issue superior'
                  ]);
                }
                const m = padreBody.match(/#(\d+)/);
                parentNum = m ? m[1] : '';
              }

              ancestors.push({ number: num, title: data.title, body: data.body || '' });
              current = parentNum;
            }

            // Guardar la cadena de issues superiores para los siguientes pasos
            const tempFile = path.join(process.env.RUNNER_TEMP, 'ancestros.json');
            fs.writeFileSync(tempFile, JSON.stringify(ancestors, null, 2));

            console.log('Issues superiores (ancestros):', JSON.stringify(ancestors.map(a => a.number), null, 2));

      - name: Validar título y nivel del padre
        uses: actions/github-script@v7
        env:
          NIVEL: ${{ env.NIVEL }}
          PADRE: ${{ env.PADRE }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.issue;
            const title = context.payload.issue?.title || context.issue.title;
            if (!title || /título/i.test(title) || /\[.*\]\s*-\s*título/i.test(title)) {
              throw new Error('El título del issue es obligatorio y no puede dejarse con el placeholder "Título".');
            }

            const normalize = text => text
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .trim()
              .toLowerCase();

            const nivel = normalize(process.env.NIVEL || '');
            const padre = (process.env.PADRE || '').trim();

            // Jerarquía: Epica > Feature > Historia De Usuario > Tarea (Bug al mismo nivel que Tarea)
            const expectedParent = {
              'feature': 'epica',
              'historia de usuario': 'feature',
              'tarea': 'historia de usuario',
              'bug': 'historia de usuario'
            };

            if (nivel !== 'epica' && !padre) {
              throw new Error('Para este nivel es obligatorio indicar el issue padre (usa el campo "Padre" del formulario o la app web de filtrado automático: https://hamiltoncasas.github.io/PruebasGIT/crear-item.html).');
            }
            if (nivel === 'epica' && padre) {
              throw new Error('Un Epica no debe tener issue padre.');
            }
            if (nivel !== 'epica') {
              const expected = expectedParent[nivel];
              if (!expected) {
                throw new Error(`Nivel desconocido para validación de padre: ${process.env.NIVEL}`);
              }
              const parentNumber = Number(padre);
              if (!Number.isInteger(parentNumber)) {
                throw new Error('El número del issue padre no es válido.');
              }

              // Obtener el body del padre directo desde la cadena de ancestros ya cargada
              let parentBody = '';
              try {
                const tempFile = path.join(process.env.RUNNER_TEMP, 'ancestros.json');
                const ancestors = JSON.parse(fs.readFileSync(tempFile, 'utf8'));
                const direct = ancestors.find(a => a.number === parentNumber);
                parentBody = direct ? direct.body : '';
              } catch (e) {}

              // Si no está en la cadena guardada, consultarlo directamente
              if (!parentBody) {
                const parentIssue = await github.rest.issues.get({
                  owner: issue.owner,
                  repo: issue.repo,
                  issue_number: parentNumber
                });
                parentBody = parentIssue.data.body || '';
              }

              const extractField = (body, fieldName) => {
                const lines = body.replace(/\r/g, '').split('\n');
                const pattern = new RegExp('^###\\s*' + fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*$', 'i');
                const normalized = s => s.trim();
                for (let i = 0; i < lines.length; i++) {
                  if (pattern.test(lines[i])) {
                    for (let j = i + 1; j < lines.length; j++) {
                      const line = normalized(lines[j]);
                      if (line && !line.startsWith('#')) {
                        return line;
                      }
                    }
                    break;
                  }
                }
                return '';
              };

              const parentNivel = normalize(extractField(parentBody, 'Nivel'));
              if (!parentNivel) {
                throw new Error(`No se encontró el Nivel en el issue padre #${parentNumber}.`);
              }
              if (parentNivel !== expected) {
                throw new Error(`El issue padre #${parentNumber} debe ser de nivel '${expected}', pero tiene nivel '${parentNivel}'.`);
              }
            }

      - name: Agregar items y issues superiores al Project v2 (campo "Nivel")
        uses: actions/github-script@v7
        env:
          NIVEL: ${{ env.NIVEL }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo, number } = context.issue;

            // Cargar la cadena de issues superiores (ancestros) generada previamente
            let ancestors = [];
            try {
              const tempFile = path.join(process.env.RUNNER_TEMP, 'ancestros.json');
              ancestors = JSON.parse(fs.readFileSync(tempFile, 'utf8'));
            } catch (e) {}

            const extractField = (body, fieldName) => {
              const lines = (body || '').replace(/\r/g, '').split('\n');
              const pattern = new RegExp('^###\\s*' + fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*$', 'i');
              const normalized = s => s.trim();
              for (let i = 0; i < lines.length; i++) {
                if (pattern.test(lines[i])) {
                  for (let j = i + 1; j < lines.length; j++) {
                    const line = normalized(lines[j]);
                    if (line && !line.startsWith('#')) {
                      return line;
                    }
                  }
                  break;
                }
              }
              return '';
            };

            const normalize = text => (text || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .trim()
              .toLowerCase();

            // Lista de items a garantizar en el Project:
            // el nuevo issue + todos los issues existentes que estén por encima (ancestros)
            const items = [{ number, nivel: process.env.NIVEL }];
            for (const anc of ancestors) {
              const nivelAncestro = extractField(anc.body, 'Nivel');
              items.push({ number: anc.number, nivel: nivelAncestro });
            }

            const queryProject = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 1) {
                    nodes {
                      id
                      title
                      fields(first: 20) {
                        nodes {
                          id
                          name
                          ... on ProjectV2SingleSelectField {
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const projectData = await github.graphql(queryProject, { owner, repo });
            const project = projectData.repository.projectsV2.nodes[0];
            if (!project) throw new Error("No se encontró ningún Project v2 en este repositorio.");

            const field = project.fields.nodes.find(f => f.name === "Nivel");
            if (!field) throw new Error("No se encontró el campo 'Nivel' en el Project.");

            const queryItem = `
              query($projectId: ID!, $issueId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 1, filter: { contentIds: [$issueId] }) {
                      nodes {
                        id
                      }
                    }
                  }
                }
              }
            `;

            const mutationAdd = `
              mutation($projectId: ID!, $issueId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $issueId }) {
                  item {
                    id
                  }
                }
              }
            `;

            const mutationUpdate = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  clientMutationId
                }
              }
            `;

            for (const item of items) {
              const issueData = await github.rest.issues.get({ owner, repo, issue_number: item.number });
              const issueId = issueData.data.node_id;

              // Verificar si el issue ya está en el Project (evita duplicados)
              let itemData = await github.graphql(queryItem, { projectId: project.id, issueId: issueId });
              let itemId = itemData.node?.items?.nodes?.[0]?.id;

              if (!itemId) {
                const added = await github.graphql(mutationAdd, { projectId: project.id, issueId: issueId });
                itemId = added.addProjectV2ItemById.item.id;
              }

              if (!item.nivel) {
                console.log(`Issue #${item.number}: presente en el Project, pero no se pudo extraer su Nivel.`);
                continue;
              }

              const nivelNorm = normalize(item.nivel);
              const option = field.options.find(o => normalize(o.name) === nivelNorm);
              if (!option) {
                console.log(`Issue #${item.number}: no se encontró la opción "${item.nivel}" en el campo 'Nivel'.`);
                continue;
              }

              await github.graphql(mutationUpdate, {
                projectId: project.id,
                itemId: itemId,
                fieldId: field.id,
                optionId: option.id
              });

              console.log(`Issue #${item.number}: Nivel "${item.nivel}" asignado en el Project.`);
            }

      - name: Crear relación con padre (comentario + etiqueta)
        if: env.PADRE != '' && env.NIVEL_NORMALIZADO != 'epica'
        uses: actions/github-script@v7
        env:
          PADRE: ${{ env.PADRE }}
        with:
          script: |
            const issue = context.issue;
            const padre = parseInt(process.env.PADRE);

            try {
              await github.rest.issues.get({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: padre
              });

              await github.rest.issues.createComment({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                body: `🔗 Este item pertenece al Issue padre #${padre}`
              });

              await github.rest.issues.addLabels({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                labels: [`parent-${padre}`]
              });
            } catch (e) {
              await github.rest.issues.createComment({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                body: `⚠️ No se encontró el Issue padre #${padre}. Verifica el número.`
              });
            }