name: Procesar Jerarquía de Issue

on:
  issues:
    types: [opened]

jobs:
  procesar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Obtener datos del formulario
        id: datos
        run: |
          BODY="${{ github.event.issue.body }}"

          python3 - <<'PY' > $GITHUB_ENV
import os, re, sys
body = os.environ.get('BODY', '')
body = body.replace('\r', '')
lines = [line.rstrip() for line in body.split('\n')]

def normalize(text):
    text = text.strip()
    text = re.sub(r'\s+', ' ', text)
    text = re.sub(r'[\(\)\[\]"\'"\?\!\.,]', '', text)
    text = text.rstrip(':').strip().lower()
    return text

expected = {
    'nivel': 'Nivel',
    'numero del issue superior': 'Número del Issue superior',
    'numero del issue superior padre': 'Número del Issue superior',
    'assignees': 'Assignees',
    'status': 'Status',
    'fecha previsto inicio': 'Fecha Previsto Inicio',
    'fecha previsto fin': 'Fecha Previsto Fin',
    'fecha real inicio': 'Fecha Real Inicio',
    'fecha real final': 'Fecha Real Final',
    'descripcion': 'Descripción',
}

values = {v: '' for v in expected.values()}

for i, line in enumerate(lines):
    stripped = line.strip()
    m = re.match(r'^(#+)\s*(.+)$', stripped)
    if not m:
        continue
    heading = normalize(m.group(2))
    if heading in expected:
        target = expected[heading]
        for next_line in lines[i + 1:]:
            next_line = next_line.strip()
            if next_line and not next_line.startswith('#'):
                values[target] = next_line
                break

if not values['Nivel']:
    print('ERROR: No se encontró el valor de Nivel en el cuerpo del issue.', file=sys.stderr)
    print('Asegúrate de usar un encabezado "### Nivel" y escribir el valor en la línea siguiente.', file=sys.stderr)
    sys.exit(1)

nivel_normalizado = values['Nivel'].strip().lower()
if nivel_normalizado != 'epica' and not values['Número del Issue superior']:
    print('ERROR: Para este nivel es obligatorio el Número del Issue superior (padre).', file=sys.stderr)
    sys.exit(1)

if nivel_normalizado == 'epica' and values['Número del Issue superior']:
    print('ERROR: Un Epica no debe tener Número del Issue superior (padre).', file=sys.stderr)
    sys.exit(1)

print(f"NIVEL={values['Nivel']}")
print(f"PADRE={values['Número del Issue superior']}")
print(f"ASSIGNEES={values['Assignees']}")
print(f"STATUS={values['Status']}")
print(f"FECHA_PREVISTO_INICIO={values['Fecha Previsto Inicio']}")
print(f"FECHA_PREVISTO_FIN={values['Fecha Previsto Fin']}")
print(f"FECHA_REAL_INICIO={values['Fecha Real Inicio']}")
print(f"FECHA_REAL_FINAL={values['Fecha Real Final']}")
print(f"DESCRIPCION={values['Descripción']}")
PY

      - name: Asignar etiqueta según nivel
        run: |
          NIVEL_NORMALIZADO=$(echo "${{ env.NIVEL }}" | tr '[:upper:]' '[:lower:]' | sed 's/á/a/g; s/é/e/g; s/í/i/g; s/ó/o/g; s/ú/u/g; s/ü/u/g; s/ñ/n/g; s/ /_/g; s/[^a-z0-9_]//g')
          case "$NIVEL_NORMALIZADO" in
            "epica") LABEL="epic" ;;
            "feature") LABEL="feature" ;;
            "historia_de_usuario") LABEL="user-story" ;;
            "tarea") LABEL="task" ;;
            "bug") LABEL="bug" ;;
            *)
              echo "ERROR: Nivel no reconocido: '${{ env.NIVEL }}'"
              exit 1
              ;;
          esac

          if [ -z "$LABEL" ]; then
            echo "ERROR: No se pudo asignar etiqueta para Nivel='${{ env.NIVEL }}'"
            exit 1
          fi

          echo "LABEL=$LABEL" >> $GITHUB_ENV
          echo "NIVEL_NORMALIZADO=$NIVEL_NORMALIZADO" >> $GITHUB_ENV

      - name: Agregar etiqueta al Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            await github.rest.issues.addLabels({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              labels: [process.env.LABEL]
            });

      - name: Validar título y nivel del padre
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            const title = context.payload.issue?.title || context.issue.title;
            if (!title || /título/i.test(title) || /\[.*\]\s*-\s*título/i.test(title)) {
              throw new Error('El título del issue es obligatorio y no puede dejarse con el placeholder "Título".');
            }

            const normalize = text => text
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .trim()
              .toLowerCase();

            const nivel = normalize(process.env.NIVEL || '');
            const padre = (process.env.PADRE || '').trim();

            const expectedParent = {
              'feature': 'epica',
              'historia de usuario': 'feature',
              'tarea': 'historia de usuario',
              'bug': 'historia de usuario'
            };

            if (nivel !== 'epica' && !padre) {
              throw new Error('Para este nivel es obligatorio indicar el issue padre.');
            }
            if (nivel === 'epica' && padre) {
              throw new Error('Un Epica no debe tener issue padre.');
            }
            if (nivel !== 'epica') {
              const expected = expectedParent[nivel];
              if (!expected) {
                throw new Error(`Nivel desconocido para validación de padre: ${process.env.NIVEL}`);
              }
              const parentNumber = Number(padre);
              if (!Number.isInteger(parentNumber)) {
                throw new Error('El número del issue padre no es válido.');
              }

              const parentIssue = await github.rest.issues.get({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: parentNumber
              });

              const parentBody = parentIssue.data.body || '';
              const extractField = (body, fieldName) => {
                const lines = body.replace(/\r/g, '').split('\n');
                const pattern = new RegExp('^###\\s*' + fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*$', 'i');
                const normalized = s => s.trim();
                for (let i = 0; i < lines.length; i++) {
                  if (pattern.test(lines[i])) {
                    for (let j = i + 1; j < lines.length; j++) {
                      const line = normalized(lines[j]);
                      if (line && !line.startsWith('#')) {
                        return line;
                      }
                    }
                    break;
                  }
                }
                return '';
              };

              const parentNivel = normalize(extractField(parentBody, 'Nivel'));
              if (!parentNivel) {
                throw new Error(`No se encontró el Nivel en el issue padre #${parentNumber}.`);
              }
              if (parentNivel !== expected) {
                throw new Error(`El issue padre #${parentNumber} debe ser de nivel '${expected}', pero tiene nivel '${parentNivel}'.`);
              }
            }

      - name: Actualizar campo "Nivel" en Project v2
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const nivel = process.env.NIVEL;
            
            const queryProject = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  projectsV2(first: 1) {
                    nodes {
                      id
                      title
                      fields(first: 20) {
                        nodes {
                          id
                          name
                          ... on ProjectV2SingleSelectField {
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const projectData = await github.graphql(queryProject, { owner, repo });
            const project = projectData.repository.projectsV2.nodes[0];
            if (!project) throw new Error("No se encontró ningún Project v2 en este repositorio.");
            
            const field = project.fields.nodes.find(f => f.name === "Nivel");
            if (!field) throw new Error("No se encontró el campo 'Nivel' en el Project.");
            
            const option = field.options.find(o => o.name === nivel);
            if (!option) throw new Error(`No se encontró la opción "${nivel}" en el campo 'Nivel'.`);
            
            const issueData = await github.rest.issues.get({ owner, repo, issue_number: number });
            const issueId = issueData.data.node_id;
            
            const mutationAdd = `
              mutation($projectId: ID!, $issueId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $issueId }) {
                  item {
                    id
                  }
                }
              }
            `;
            await github.graphql(mutationAdd, { projectId: project.id, issueId: issueId });
            
            const queryItem = `
              query($projectId: ID!, $issueId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 1, filter: { contentIds: [$issueId] }) {
                      nodes {
                        id
                      }
                    }
                  }
                }
              }
            `;
            const itemData = await github.graphql(queryItem, { projectId: project.id, issueId: issueId });
            const itemId = itemData.node.items.nodes[0].id;
            
            const mutationUpdate = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  clientMutationId
                }
              }
            `;
            await github.graphql(mutationUpdate, {
              projectId: project.id,
              itemId: itemId,
              fieldId: field.id,
              optionId: option.id
            });
            
            console.log(`Campo "Nivel" actualizado a "${nivel}" en el Project.`);

      - name: Crear relación con padre (comentario + etiqueta)
        if: env.PADRE != '' && env.NIVEL_NORMALIZADO != 'epica'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            const padre = parseInt(process.env.PADRE);
            
            try {
              await github.rest.issues.get({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: padre
              });
              
              await github.rest.issues.createComment({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                body: `🔗 Este item pertenece al Issue padre #${padre}`
              });
              
              await github.rest.issues.addLabels({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                labels: [`parent-${padre}`]
              });
            } catch (e) {
              await github.rest.issues.createComment({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                body: `⚠️ No se encontró el Issue padre #${padre}. Verifica el número.`
              });
            }