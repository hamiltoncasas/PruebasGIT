name: Sincronizar Plantilla de Items

on:
  workflow_dispatch:
  issues:
    types: [opened, closed, reopened, edited]

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Obtener issues por nivel y generar JSON de opciones
        id: opciones
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const normalize = text => (text || '')
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .trim()
              .toLowerCase();

            const extractField = (body, fieldName) => {
              const lines = (body || '').replace(/\r/g, '').split('\n');
              const pattern = new RegExp('^###\\s*' + fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*$', 'i');
              for (let i = 0; i < lines.length; i++) {
                if (pattern.test(lines[i])) {
                  for (let j = i + 1; j < lines.length; j++) {
                    const line = lines[j].trim();
                    if (line && !line.startsWith('#')) {
                      return line;
                    }
                  }
                  break;
                }
              }
              return '';
            };

            const mapEtiqueta = {
              'epic': 'epica',
              'feature': 'feature',
              'user-story': 'historia de usuario',
              'task': 'tarea',
              'bug': 'bug'
            };

            const { owner, repo } = context.repo;
            const issues = [];
            for await (const response of github.paginate.iterator(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            )) {
              for (const issue of response.data) {
                if (issue.pull_request) continue; // solo issues, no PRs
                issues.push(issue);
              }
            }

            const porNivel = { epica: [], feature: [], 'historia de usuario': [] };
            for (const issue of issues) {
              // 1) Intentar por etiqueta
              const etiquetas = issue.labels.map(l => l.name.toLowerCase());
              let nivel = '';
              for (const [label, nivelNombre] of Object.entries(mapEtiqueta)) {
                if (etiquetas.includes(label)) {
                  nivel = nivelNombre;
                  break;
                }
              }
              // 2) Si no hay etiqueta, leer el campo "Nivel" del body
              if (!nivel) {
                nivel = normalize(extractField(issue.body, 'Nivel'));
              }

              const entrada = { number: issue.number, title: issue.title };
              if (nivel === 'epica') porNivel.epica.push(entrada);
              else if (nivel === 'feature') porNivel.feature.push(entrada);
              else if (nivel === 'historia de usuario') porNivel['historia de usuario'].push(entrada);
            }

            const data = {
              epicas: porNivel.epica,
              features: porNivel.feature,
              historias: porNivel['historia de usuario']
            };

            const jsonPath = path.join(process.env.RUNNER_TEMP, 'opciones.json');
            fs.writeFileSync(jsonPath, JSON.stringify(data));
            fs.appendFileSync(process.env.GITHUB_ENV, `OPCIONES_JSON=${jsonPath}\n`);

            console.log('Epicas:', porNivel.epica.length);
            console.log('Features:', porNivel.feature.length);
            console.log('Historias:', porNivel['historia de usuario'].length);

      - name: Generar plantilla con opciones actualizadas
        run: |
          python .github/scripts/generar_plantilla.py < "$OPCIONES_JSON" > .github/ISSUE_TEMPLATE/nuevo-item.yml

      - name: Verificar si hubo cambios y commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .github/ISSUE_TEMPLATE/nuevo-item.yml; then
            echo "Sin cambios en la plantilla."
            echo "CAMBIOS=false" >> $GITHUB_ENV
          else
            git add .github/ISSUE_TEMPLATE/nuevo-item.yml
            git commit -m "chore: sincronizar opciones de padres en la plantilla de items"
            echo "CAMBIOS=true" >> $GITHUB_ENV
          fi

      - name: Push de la plantilla actualizada
        if: env.CAMBIOS == 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }}