name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio con crear-item.html
        run: |
          mkdir -p public
          cp .github/crear-item.html public/crear-item.html
          echo '<h1>Crear Item Jerárquico</h1>' > public/index.html
          echo '<p>Abre el <a href="crear-item.html">creador visual con filtrado automático del padre</a>.</p>' >> public/index.html

      - name: Subir artifact (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4