<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Item Jerárquico</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #f6f8fa; color: #24292f; }
  h1 { font-size: 24px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  select, input { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; font-size: 14px; box-sizing: border-box; }
  .hint { font-size: 12px; color: #57606a; margin-top: 4px; }
  .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #1f883d; color: #fff; border: 0; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn:disabled { background: #94d3a2; cursor: not-allowed; }
  .btn-secondary { background: #0969da; }
  .error { color: #cf222e; font-size: 13px; margin-top: 8px; display: none; }
  #info { font-size: 13px; color: #57606a; margin-top: 12px; }

  /* Modal (se abre ENCIMA de la página) */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: center; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 24px; max-width: 480px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .modal h3 { margin-top: 0; }
  .modal .fila { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .modal .fila strong { color: #57606a; }
  .modal .acciones { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn-cerrar { background: #d0d7de; color: #24292f; }
</style>
</head>
<body>
<div class="card">
  <h1>Crear Item Jerárquico</h1>
  <p style="font-size:14px;color:#57606a;">
    Jerarquía: <strong>Epica > Feature > Historia De Usuario > Tarea</strong>
    (Bug está al mismo nivel que Tarea)
  </p>

  <label for="nivel">Nivel</label>
  <select id="nivel">
    <option value="">Selecciona un nivel...</option>
    <option value="epica">Epica</option>
    <option value="feature">Feature</option>
    <option value="historia de usuario">Historia De Usuario</option>
    <option value="tarea">Tarea</option>
    <option value="bug">Bug</option>
  </select>

  <label for="padre">Padre <span id="padreRequerido" style="color:#cf222e;"></span></label>
  <select id="padre" disabled>
    <option value="">Selecciona primero el nivel...</option>
  </select>
  <div class="hint" id="hintPadre"></div>

  <label for="titulo">Título (obligatorio)</label>
  <input type="text" id="titulo" placeholder="Ej: Crear pantalla de login">

  <label for="status">Status</label>
  <select id="status">
    <option value="Nuevo">Nuevo</option>
    <option value="En Progreso">En Progreso</option>
    <option value="En Revisión">En Revisión</option>
    <option value="Completado">Completado</option>
  </select>

  <div id="info">Cargando issues del repositorio...</div>
  <div class="error" id="error"></div>

  <button class="btn" id="crearBtn" disabled>Crear Issue</button>
</div>

<!-- Modal que se abre encima -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Confirmar creación</h3>
    <div id="modalResumen"></div>
    <div class="acciones">
      <button class="btn btn-secondary" id="confirmarBtn">Abrir formulario en GitHub</button>
      <button class="btn btn-cerrar" id="cerrarBtn">Cancelar</button>
    </div>
  </div>
</div>

<script>
const REPO_OWNER = 'hamiltoncasas';
const REPO_NAME = 'PruebasGIT';
const JERARQUIA = {
  'epica': '',
  'feature': 'epica',
  'historia de usuario': 'feature',
  'tarea': 'historia de usuario',
  'bug': 'historia de usuario'
};
const NOMBRE_NIVEL = {
  'epica': 'Epica',
  'feature': 'Feature',
  'historia de usuario': 'Historia De Usuario',
  'tarea': 'Tarea',
  'bug': 'Bug'
};

const issuesPorNivel = { 'epica': [], 'feature': [], 'historia de usuario': [] };

const normalize = (t) => (t || '')
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '')
  .replace(/[()\[\]"'"?.,:]/g, '')
  .replace(/\s+/g, ' ')
  .trim()
  .toLowerCase();

function extractField(body, fieldName) {
  const lines = (body || '').replace(/\r/g, '').split('\n');
  const pattern = new RegExp('^###\\s*' + fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*:?\\s*$', 'i');
  for (let i = 0; i < lines.length; i++) {
    if (pattern.test(lines[i])) {
      for (let j = i + 1; j < lines.length; j++) {
        const line = lines[j].trim();
        if (line && !line.startsWith('#') && normalize(line).replace(/_/g, ' ') !== 'no response') return line;
      }
      break;
    }
  }
  return '';
}

function nivelDeIssue(issue) {
  // 1) Por body (campo Nivel)
  const body_nivel = normalize(extractField(issue.body, 'Nivel'));
  if (body_nivel) return body_nivel;
  // 2) Por etiquetas
  const labels = (issue.labels || []).map(l => l.name.toLowerCase());
  const map = { 'epic': 'epica', 'feature': 'feature', 'user-story': 'historia de usuario', 'task': 'tarea', 'bug': 'bug' };
  for (const [label, nivel] of Object.entries(map)) {
    if (labels.includes(label)) return nivel;
  }
  return '';
}

async function cargarIssues() {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=open&per_page=100`;
  let res;
  try {
    res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
  } catch (e) {
    throw new Error('No se pudo conectar con la API de GitHub (¿estás abriendo el archivo como file://? Prueba con GitHub Pages o con un servidor local). Detalle: ' + e.message);
  }
  if (res.status === 403 || res.status === 429) {
    throw new Error('Límite de solicitudes de la API de GitHub alcanzado (60/hora por IP). Espera un poco o usa GitHub Pages.');
  }
  if (!res.ok) throw new Error(`API GitHub: ${res.status} ${res.statusText}`);
  const issues = await res.json();
  let contados = 0;
  for (const issue of issues) {
    if (issue.pull_request) continue;
    const nivel = nivelDeIssue(issue);
    const entrada = { number: issue.number, title: issue.title };
    if (nivel === 'epica') issuesPorNivel.epica.push(entrada);
    else if (nivel === 'feature') issuesPorNivel.feature.push(entrada);
    else if (nivel === 'historia de usuario') issuesPorNivel['historia de usuario'].push(entrada);
    contados++;
  }
  document.getElementById('info').textContent =
    `Issues cargados: ${contados}. Epicas: ${issuesPorNivel.epica.length}, Features: ${issuesPorNivel.feature.length}, Historias: ${issuesPorNivel['historia de usuario'].length}`;
  actualizarPadre();
}

function actualizarPadre() {
  const nivel = document.getElementById('nivel').value;
  const sel = document.getElementById('padre');
  const hint = document.getElementById('hintPadre');
  const req = document.getElementById('padreRequerido');

  sel.innerHTML = '';
  sel.disabled = true;

  const nivelPadre = JERARQUIA[nivel] || '';
  if (!nivel) {
    sel.innerHTML = '<option value="">Selecciona primero el nivel...</option>';
    hint.textContent = '';
    req.textContent = '';
    return;
  }
  if (!nivelPadre) {
    sel.innerHTML = '<option value="">(Epica no tiene padre)</option>';
    hint.textContent = 'Una Epica no tiene nivel superior.';
    req.textContent = '';
    validarBoton();
    return;
  }

  const lista = issuesPorNivel[nivelPadre] || [];
  req.textContent = '*';
  if (lista.length === 0) {
    sel.innerHTML = `<option value="">(No hay ${NOMBRE_NIVEL[nivelPadre]}s creadas. Crea una primero.)</option>`;
    hint.textContent = `Debes crear primero una ${NOMBRE_NIVEL[nivelPadre]} para poder seleccionarla.`;
  } else {
    sel.innerHTML = '<option value="">Selecciona el padre...</option>' +
      lista.map(i => `<option value="${i.number}">#${i.number} - ${i.title}</option>`).join('');
    hint.textContent = `Mostrando solo ${NOMBRE_NIVEL[nivelPadre]}s (nivel superior de ${NOMBRE_NIVEL[nivel]}).`;
  }
  sel.disabled = false;
  validarBoton();
}

function validarBoton() {
  const nivel = document.getElementById('nivel').value;
  const titulo = document.getElementById('titulo').value.trim();
  const nivelPadre = JERARQUIA[nivel] || '';
  const padreSel = document.getElementById('padre');
  const hayPadre = !nivelPadre || (padreSel.value !== '' && !padreSel.disabled);
  document.getElementById('crearBtn').disabled = !(nivel && titulo && hayPadre);
}

function construirBody() {
  const nivel = document.getElementById('nivel').value;
  const padreNum = document.getElementById('padre').value;
  const status = document.getElementById('status').value;

  let body = `### Nivel\n\n${NOMBRE_NIVEL[nivel]}\n\n`;
  if (padreNum) {
    const nivelPadre = JERARQUIA[nivel];
    const nombreHeading = nivelPadre === 'epica' ? 'Padre (Epica)' : nivelPadre === 'feature' ? 'Padre (Feature)' : 'Padre (Historia de Usuario)';
    const issuePadre = (issuesPorNivel[nivelPadre] || []).find(i => String(i.number) === padreNum);
    body += `### ${nombreHeading}\n\n#${padreNum} - ${issuePadre ? issuePadre.title : ''}\n\n`;
  }
  body += `### Status\n\n${status}\n\n`;
  body += '### Fecha Previsto Inicio\n\n_No response_\n\n';
  body += '### Fecha Previsto Fin\n\n_No response_\n\n';
  body += '### Fecha Real Inicio\n\n_No response_\n\n';
  body += '### Fecha Real Final\n\n_No response_\n\n';
  return body;
}

function abrirModal() {
  const nivel = document.getElementById('nivel').value;
  const padreNum = document.getElementById('padre').value;
  const titulo = document.getElementById('titulo').value.trim();

  const nivelPadre = JERARQUIA[nivel];
  let padreTexto = '(sin padre)';
  if (padreNum) {
    const issuePadre = (issuesPorNivel[nivelPadre] || []).find(i => String(i.number) === padreNum);
    padreTexto = `#${padreNum} - ${issuePadre ? issuePadre.title : ''}`;
  }

  document.getElementById('modalResumen').innerHTML =
    `<div class="fila"><strong>Nivel</strong><span>${NOMBRE_NIVEL[nivel]}</span></div>` +
    `<div class="fila"><strong>Padre</strong><span>${padreTexto}</span></div>` +
    `<div class="fila"><strong>Título</strong><span>${titulo.replace(/</g, '<')}</span></div>`;

  document.getElementById('overlay').classList.add('show');
}

function confirmarCrear() {
  const titulo = document.getElementById('titulo').value.trim();
  const body = construirBody();
  const params = new URLSearchParams({
    title: `[${NOMBRE_NIVEL[document.getElementById('nivel').value]}] ${titulo}`,
    body: body
  });
  // Abre el formulario de GitHub en la MISMA pestaña (sin pantalla nueva)
  window.location.href = `https://github.com/${REPO_OWNER}/${REPO_NAME}/issues/new?${params.toString()}`;
}

function cerrarModal() {
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('nivel').addEventListener('change', actualizarPadre);
document.getElementById('padre').addEventListener('change', validarBoton);
document.getElementById('titulo').addEventListener('input', validarBoton);
document.getElementById('crearBtn').addEventListener('click', abrirModal);
document.getElementById('confirmarBtn').addEventListener('click', confirmarCrear);
document.getElementById('cerrarBtn').addEventListener('click', cerrarModal);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) cerrarModal(); });

// Inicio
document.getElementById('nivel').disabled = true;
cargarIssues()
  .then(() => { document.getElementById('nivel').disabled = false; })
  .catch(e => {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Error al cargar issues: ' + e.message;
    document.getElementById('info').textContent = '';
    // Permitir crear sin dependencia de los issues cargados (con padre manual opcional)
    document.getElementById('nivel').disabled = false;
  });
</script>
</body>
</html>
